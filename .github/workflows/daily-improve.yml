name: Self-Evolution

on:
  schedule:
    # Every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:  # manual trigger from GitHub UI

concurrency:
  group: self-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # needed to push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light test dependencies
        # Only what pure-logic unit tests need; the full requirements.txt is far too heavy for CI.
        run: pip install -q loguru requests python-dotenv pyyaml

      - name: Run self-evolution step
        run: python scripts/daily_improve.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
